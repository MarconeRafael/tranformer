[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tranformer"
version = "0.0.0"
description = "Educational Vision Transformer (ViT) implemented in pure Python (no NumPy)."
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}

[tool.setuptools.packages.find]
where = ["src"]
